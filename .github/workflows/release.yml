name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows ${{ matrix.arch }} release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            rid: win-x64
          - arch: arm64
            runner: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw -Encoding UTF8).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "VERSION ($version) does not match tag ${{ github.ref_name }}"
          }
      - name: Build, test, and package
        shell: pwsh
        run: ./package.ps1 -RuntimeIdentifier ${{ matrix.rid }} -Toolchain msvc
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: |
            dist/CodeXPets-v*-${{ matrix.rid }}.exe
            dist/CodeXPets-v*-${{ matrix.rid }}.zip
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            rid: osx-arm64
          - arch: x64
            runner: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        run: test "v$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}"
      - name: Check signing secrets
        id: signing
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODE_SIGN_IDENTITY: ${{ secrets.MACOS_CODE_SIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [[ -n "${MACOS_CERTIFICATE_P12_BASE64:-}" && -n "${MACOS_CERTIFICATE_PASSWORD:-}" \
            && -n "${MACOS_CODE_SIGN_IDENTITY:-}" && -n "${APPLE_API_KEY_ID:-}" \
            && -n "${APPLE_API_ISSUER_ID:-}" && -n "${APPLE_API_PRIVATE_KEY:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Developer ID certificate and notary credentials
        if: steps.signing.outputs.available == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/codexpets-release.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/codexpets-signing.keychain-db"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$API_KEY_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          xcrun notarytool store-credentials codexpets-release-notary \
            --key "$API_KEY_PATH" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID"
          echo "MACOS_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "MACOS_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
      - name: Build, test, sign, notarize, and package
        env:
          SIGNING_AVAILABLE: ${{ steps.signing.outputs.available }}
          MACOS_CODE_SIGN_IDENTITY: ${{ secrets.MACOS_CODE_SIGN_IDENTITY }}
        run: |
          if [[ "$SIGNING_AVAILABLE" == "true" ]]; then
            export CODE_SIGN_IDENTITY="$MACOS_CODE_SIGN_IDENTITY"
            export APPLE_NOTARY_PROFILE=codexpets-release-notary
            export REQUIRE_NOTARIZATION=1
          else
            export CODE_SIGN_IDENTITY=-
            export APPLE_NOTARY_PROFILE=
            export REQUIRE_NOTARIZATION=0
          fi
          bash scripts/build-macos.sh "${{ matrix.rid }}"
      - name: Remove temporary signing material
        if: always() && steps.signing.outputs.available == 'true'
        run: |
          if [[ -n "${MACOS_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$MACOS_SIGNING_KEYCHAIN" || true
          fi
          if [[ -n "${MACOS_API_KEY_PATH:-}" ]]; then
            rm -f "$MACOS_API_KEY_PATH"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            dist/CodeXPets-v*-macos-${{ matrix.arch }}.zip
            dist/CodeXPets-v*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Generate SHA-256 checksums
        run: |
          cd release
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' \
            | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "CodeXPets ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
