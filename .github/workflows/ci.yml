name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            rid: win-x64
          - arch: arm64
            runner: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        shell: pwsh
        run: |
          cmake --version
          Write-Host "Host architecture: $([Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
      - name: Build, test, validate, and package
        shell: pwsh
        run: ./package.ps1 -RuntimeIdentifier ${{ matrix.rid }} -Toolchain msvc
      - uses: actions/upload-artifact@v4
        with:
          name: CodeXPets-${{ matrix.rid }}
          path: |
            dist/CodeXPets-v*-${{ matrix.rid }}.exe
            dist/CodeXPets-v*-${{ matrix.rid }}.zip
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            rid: osx-arm64
          - arch: x64
            runner: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          cmake --version
          clang++ --version
          uname -a
      - name: Build, test, sign, and package
        run: bash scripts/build-macos.sh "${{ matrix.rid }}"
      - uses: actions/upload-artifact@v4
        with:
          name: CodeXPets-macos-${{ matrix.arch }}
          path: |
            dist/CodeXPets-v*-macos-${{ matrix.arch }}.zip
            dist/CodeXPets-v*-macos-${{ matrix.arch }}.dmg
            dist/SHA256SUMS-macos.txt
          if-no-files-found: error
          retention-days: 7
